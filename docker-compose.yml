version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ghules_kitchen.db
      - SECRET_KEY=ghules-kitchen-super-secret-key-2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/ghules_kitchen.db:/app/ghules_kitchen.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
